<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RecNova.com is shutting down</title>
<meta name="description" content="RecNova.com is shutting down soon. We're moving to recnova.net.">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Segoe UI", system-ui, -apple-system, sans-serif; background:#f6f4ff; color:#141428;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { text-align:center; max-width:560px; }
  .logo { font-size:28px; font-weight:800; letter-spacing:-.5px; margin-bottom:24px; }
  .logo span { background:linear-gradient(135deg,#7c3aed,#3b82f6);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  h1 { font-size:clamp(30px,5vw,44px); font-weight:800; letter-spacing:-1px; margin-bottom:16px; }
  p { font-size:18px; color:#5a5a72; line-height:1.6; margin-bottom:12px; }
  .btn { display:inline-block; margin-top:20px; padding:14px 32px; border-radius:999px; font-weight:700;
    color:#fff; background:linear-gradient(135deg,#ff7a1a,#ec4899);
    box-shadow:0 8px 24px rgba(236,72,153,.35); text-decoration:none; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">Rec<span>Nova</span></div>
  <h1>RecNova.com is shutting down.</h1>
  <p>We're moving to <a href="https://recnova.net">recnova.net</a>.</p>
  <p>Download buttons have stopped working.</p>
  <a class="btn" href="https://recnova.net">Go to recnova.net</a>
</div>

</body>
</html>
